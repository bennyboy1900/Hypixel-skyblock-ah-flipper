plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // SQLite JDBC driver is bundled (jar-in-jar) so the mod has no external runtime deps.
    implementation "org.xerial:sqlite-jdbc:${project.sqlite_version}"
    include "org.xerial:sqlite-jdbc:${project.sqlite_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
    runs {
        client {
            // ./gradlew runClient -PopenOnStart=DASHBOARD opens the terminal over the title screen (debugging aid).
            if (project.hasProperty('openOnStart')) property('skytrade.openOnStart', project.property('openOnStart'))
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    // Opt-in live test against the public Hypixel API: ./gradlew test -Dskytrade.live=true
    systemProperty "skytrade.live", System.getProperty("skytrade.live", "false")
    testLogging { showStandardStreams = System.getProperty("skytrade.live") == "true" }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar { from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }
